name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zig:
    name: zig fmt + build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig fmt --check
        run: zig fmt --check .
      - name: zig build
        run: zig build install-shell install-provider --summary all
      # Compiles the Zig bindings for wasm32-emscripten (no emsdk needed).
      - name: zig build test
        run: zig build test --summary all

  # The EM_JS storage factory, extracted verbatim from src/web_storage.c and
  # driven against fake-indexeddb.
  storage-node:
    name: IndexedDB storage (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/web-storage
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm test

  # Compiles web_storage.c with emcc and runs the real EM_JS entry points from
  # wasm under Node. A JS exception crossing EM_JS aborts the module, so any
  # entry point that throws fails this job. emsdk is pinned to the release
  # labelle-bgfx's wasm build resolves (build.zig.zon `.emsdk`, ref 4.0.9).
  emscripten:
    name: emcc compile + wasm boundary run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMSDK_VERSION: 4.0.9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        run: |
          set -euo pipefail
          if [ ! -x ~/emsdk/emsdk ]; then
            git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk ~/emsdk
          fi
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
      - name: Build and run the wasm boundary test
        run: |
          set -euo pipefail
          source ~/emsdk/emsdk_env.sh
          emcc --version | head -1
          mkdir -p zig-out/wasm-boundary
          emcc -O1 -Wall -Werror -sENVIRONMENT=node \
            tests/wasm-boundary/boundary.c src/web_storage.c \
            -o zig-out/wasm-boundary/boundary.js
          node zig-out/wasm-boundary/boundary.js
      - name: Build a real Emscripten shell fixture
        run: |
          source ~/emsdk/emsdk_env.sh
          mkdir -p zig-out/shell-fixture
          emcc -O1 tests/shell/main.c -o zig-out/shell-fixture/game.js
          zig build install-shell install-provider
      - run: npm ci --ignore-scripts
        working-directory: tests/shell
      - run: npx playwright install --with-deps chromium
        working-directory: tests/shell
      - name: Check real Emscripten startup in Chromium
        run: EMCC_FIXTURE="$GITHUB_WORKSPACE/zig-out/shell-fixture" BROWSERS=chromium npm test
        working-directory: tests/shell

  shell:
    name: Browser shell (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: zig build install-shell install-provider
      - run: npm ci --ignore-scripts
        working-directory: tests/shell
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: tests/shell
      - run: npm test
        working-directory: tests/shell

  provider:
    name: Provider commands and hooks (real CLI ${{ matrix.cli.version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Both CLI majors in the field: 2.1.x still speaks this provider's
        # command contract (>=1.3.0 <1.6.0), and 3.0.0 is the current release.
        # e2e.py branches on `labelle --version` (the 3.x core has no `wasm`).
        cli:
          - version: 2.1.0
            ref: ffce35fc6cc05cfce0ca3557f38a2c46ee8d9c0e
          - version: 3.0.0
            ref: 0fc952fa475707884f2f85863be7b78686de523b
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.12'
      # The labelle-cli release under test, pinned to its tag's commit.
      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: ${{ matrix.cli.ref }}
          path: .test-cli
          persist-credentials: false
      - run: zig build
        working-directory: .test-cli
      - run: zig build install-provider
      - name: Exercise CLI discovery, serving, export and hook contexts
        shell: bash
        env:
          # setup-python's interpreter by path: `python3` is not on every Windows runner.
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: '"$PYTHON" tests/provider/e2e.py --cli .test-cli/zig-out/bin/labelle --zig "$(command -v zig)"'
      - name: Toolchain hooks, doctor and browser watch through the pipeline
        shell: bash
        env:
          # setup-python's interpreter by path: `python3` is not on every Windows runner.
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: '"$PYTHON" tests/provider/toolchain_e2e.py --cli .test-cli/zig-out/bin/labelle --zig "$(command -v zig)"'

  # The real toolchain bootstrap (RFC labelle-cli#466 §8): a fresh
  # `labelle init` project builds for wasm with a clean LABELLE_HOME, EMSDK
  # unset and no emcc on PATH, so the provider itself fetches, verifies and
  # activates emsdk (~1 GB, deliberately not cached: a cache hit would
  # skip exactly what this job proves). The managed install is then moved
  # out of the cache and handed back as an external EMSDK, which must be
  # passed through without a download.
  wasm-from-zero:
    name: wasm from zero (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Zig builds the CLI under test; the project's own Zig is provisioned
      # by that CLI into the clean LABELLE_HOME.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.12'
      # labelle-cli v3.0.0 (the current release) only: this job downloads
      # ~1 GB per run, so the 2.1.x coverage lives in the provider job.
      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: 0fc952fa475707884f2f85863be7b78686de523b
          path: .test-cli
          persist-credentials: false
      - run: zig build
        working-directory: .test-cli
      - name: Build wasm from zero
        shell: bash
        env:
          # setup-python's interpreter by path: `python3` is not on every Windows runner.
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: '"$PYTHON" tests/provider/wasm_from_zero.py --cli .test-cli/zig-out/bin/labelle --work "$RUNNER_TEMP/wz" --mode managed'
      - name: External EMSDK is passed through without a download
        shell: bash
        env:
          # setup-python's interpreter by path: `python3` is not on every Windows runner.
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: '"$PYTHON" tests/provider/wasm_from_zero.py --cli .test-cli/zig-out/bin/labelle --work "$RUNNER_TEMP/wz" --mode passthrough'
